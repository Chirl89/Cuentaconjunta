name: FitDuo Automated Bank Sync

on:
  schedule:
    # Run twice an hour at off-peak minutes (:20 and :50) to avoid GitHub Actions queue delays
    - cron: '20 * * * *'
    - cron: '50 * * * *'
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Código de autorización (?code=... tras autorizar el banco en el enlace)'
        required: false
        type: string
      bank_name:
        description: 'Nombre de la entidad bancaria (ej. Bankinter, BBVA, Revolut)'
        required: false
        default: 'Bankinter'
        type: string

permissions:
  contents: write

concurrency:
  group: "bank-sync"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Complete Bank Auth or Run Bank Sync
        run: |
          if [ -n "${{ github.event.inputs.auth_code }}" ]; then
            echo "Processing bank authorization code for ${{ github.event.inputs.bank_name }}..."
            node scripts/complete-auth.js --code="${{ github.event.inputs.auth_code }}" --bank="${{ github.event.inputs.bank_name }}"
          else
            echo "Running scheduled bank synchronization..."
            node scripts/sync-banks.js
          fi
        env:
          ENABLEBANKING_APP_ID: ${{ secrets.ENABLEBANKING_APP_ID || '5e9f0c1c-6983-4f3f-86b0-c37e9f8be32f' }}
          ENABLEBANKING_PRIVATE_KEY: ${{ secrets.ENABLEBANKING_PRIVATE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: "https://egougygfqnnzfqpceggn.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_hGjr4Hb-601X2np1wi1d4g_gPGdg192"

      - name: Commit & push updated bank feed
        run: |
          git config user.name "FitDuo Bank Sync Bot"
          git config user.email "bot@fitduo.app"
          git add public/data/bank-feed.json data/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(sync): automated bank feed update"
            git pull --rebase origin main || true
            git push origin main || echo "Warning: Unable to push automated bank sync feed to main (concurrent commit or branch permissions)."
          else
            echo "No bank feed changes detected."
          fi
