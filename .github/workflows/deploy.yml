name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build and export static HTML
        run: |
          cp version.json ./public/version.json
          npm run build
          cp version.json ./out/version.json 2>/dev/null || true
          touch ./out/.nojekyll
        env:
          GITHUB_ACTIONS: "true"
          NEXT_PUBLIC_SUPABASE_URL: "https://egougygfqnnzfqpceggn.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_hGjr4Hb-601X2np1wi1d4g_gPGdg192"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
