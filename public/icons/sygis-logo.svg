<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sygisCosmosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1B2A" />
      <stop offset="100%" stop-color="#121E2E" />
    </linearGradient>

    <linearGradient id="sygisOrbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0E1DD" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#E0E1DD" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="sygisEclipseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="35%" stop-color="#00F5D4" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#00F5D4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="sygisTurquoiseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00BFA5" />
    </linearGradient>

    <filter id="sygisNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cosmos Deep Night / Slate Graphite Background -->
  <rect width="512" height="512" rx="128" fill="url(#sygisCosmosGrad)" />

  <!-- Outer ambient glow of the financial eclipse -->
  <circle cx="256" cy="256" r="130" fill="url(#sygisEclipseGlow)" opacity="0.65" />

  <!-- 1. Left celestial orbit (Person A) -->
  <circle cx="176" cy="256" r="105" fill="none" stroke="url(#sygisOrbitGrad)" stroke-width="18" stroke-linecap="round" opacity="0.88" />

  <!-- 2. Right celestial orbit (Person B) -->
  <circle cx="336" cy="256" r="105" fill="none" stroke="url(#sygisOrbitGrad)" stroke-width="18" stroke-linecap="round" opacity="0.88" />

  <!-- 3. Center orbit: The Syzygy alignment & shared union (∞) -->
  <circle cx="256" cy="256" r="105" fill="none" stroke="url(#sygisTurquoiseGrad)" stroke-width="20" stroke-linecap="round" filter="url(#sygisNeonGlow)" />

  <!-- Central Intersection: Abstract Cutout Coin Silhouette -->
  <circle cx="256" cy="256" r="54" fill="none" stroke="#00F5D4" stroke-width="8" opacity="0.95" />

  <!-- Central burst of light (The Eclipse Flare) -->
  <circle cx="256" cy="256" r="32" fill="url(#sygisEclipseGlow)" />

  <!-- 4-point radiant stellar flare of financial alignment -->
  <path d="M 256 218 Q 256 256 218 256 Q 256 256 256 294 Q 256 256 294 256 Q 256 256 256 218 Z" fill="#FFFFFF" />
  <circle cx="256" cy="256" r="8" fill="#00F5D4" />
</svg>
